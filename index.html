<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>JARVIS MARK IX - THINKING MATRIX</title>
    <style>
        body { background-color: #01040a; margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; color: #00d2ff; user-select: none; }
        #canvas-zone { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #webcam { position: absolute; top: 40px; right: 40px; width: 240px; height: 180px; z-index: 20; border: 2px solid rgba(0, 210, 255, 0.4); transform: scaleX(-1); border-radius: 12px; filter: grayscale(100%) contrast(110%) sepia(30%) hue-rotate(150deg); }
        
        .hud-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        #sys-status { position: absolute; top: 40px; left: 40px; font-size: 28px; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 15px #00d2ff; }
        #gesture-status { position: absolute; top: 85px; left: 40px; font-size: 18px; color: #ffaa00; text-shadow: 0 0 8px #ffaa00; font-weight: bold; }
        
        /* 🌟 电影级：贾维斯专属深度思维计算流 HUD 视窗 */
        #thinking-matrix { position: absolute; top: 135px; left: 40px; width: 420px; height: 350px; background: rgba(0, 210, 255, 0.02); border-left: 3px solid #00d2ff; padding: 15px; font-size: 14px; font-family: 'Courier New', monospace; color: #00ffcc; overflow-y: auto; pointer-events: auto; line-height: 1.6; box-sizing: border-box; text-shadow: 0 0 4px rgba(0,255,204,0.5); }
        #thinking-matrix::-webkit-scrollbar { width: 4px; }
        #thinking-matrix::-webkit-scrollbar-thumb { background: rgba(0, 210, 255, 0.3); }
        
        #subtitle-box { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); width: 75%; text-align: center; font-size: 24px; color: #ffffff; text-shadow: 0 0 15px #00d2ff; font-weight: 600; line-height: 1.6; }
        #panel { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0, 210, 255, 0.03); border: 1px solid rgba(0, 210, 255, 0.2); padding: 15px 40px; border-radius: 10px; font-size: 15px; text-align: center; backdrop-filter: blur(6px); }
        #start-shield { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #01040a; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .btn { padding: 25px 50px; border: 2px solid #00d2ff; background: rgba(0, 210, 255, 0.1); color: #00d2ff; font-size: 22px; font-weight: bold; letter-spacing: 3px; box-shadow: 0 0 40px rgba(0, 210, 255, 0.4); border-radius: 6px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="start-shield" onclick="bootMarkIX()">
        <div class="btn">初始化 MARK IX 思维矩阵舱</div>
    </div>

    <div id="canvas-zone"></div>
    <video id="webcam" autoplay playsinline></video>

    <div class="hud-overlay">
        <div id="sys-status">JARVIS MARK IX: OFFLINE</div>
        <div id="gesture-status">SPATIAL RADAR: OFFLINE</div>
        <div id="thinking-matrix">💡 SYSTEM STATUS: READY<br>等待激活中枢网络...</div>
        <div id="subtitle-box"></div>
        <div id="panel">
            🧬 <b>DeepSeek-R1 深度思维流已载入</b> | 随时开口说话，支持强行打断交互 | 键盘 <b>F11</b> 全屏幕<br>
            ✋ <b>双手地图解析手势</b>：伸出双手：拉开=向前推进透视全息模型 | 靠近=后退 | 双手捏合=拖拽平移视角
        </div>
    </div>

    <script>
        // 🔑 确保此处填入的是全新生成的有效密钥！
        const DEEPSEEK_API_KEY = "sk-joikwvbzzgcfhbdyiwnrkiwkvxgisedoirvstkqsysdzsfiw";
        const TAVILY_API_KEY = "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"; 
        
        // 🌟 切换为最高规格的推理大模型：DeepSeek-R1
        const MODEL_ID = "deepseek-ai/DeepSeek-R1";
        let messages = [{"role": "system", "content": "你是贾维斯(JARVIS)，托尼·斯塔克的全能AI管家。必须称呼用户为“先生(Sir)”。说话语气高智商、冷静、优雅且绝对忠诚。请保持精炼，严禁输出任何Markdown符号。回答前请在内心深处进行长考。"}];

        let scene, camera, renderer, particleSystem;
        let animationStatus = "IDLE"; 
        let waveClock = 0;
        let originalCameraPosition = new THREE.Vector3(0, 0, 240); 
        let isTaskLock = false;
        let midpointX_last = 0.5, midpointY_last = 0.5;

        function init3DMatrix() {
            const zone = document.getElementById('canvas-zone');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.copy(originalCameraPosition);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            zone.appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(4500 * 3); 
            for (let i = 0; i < 4500; i++) {
                const theta = Math.random() * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * Math.random() - 1.0);
                const r = 95 + Math.random() * 6;
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: 0x00d2ff, size: 1.5, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            waveClock += 0.05;
            particleSystem.rotation.y += 0.002;
            
            if (animationStatus === "SPEAKING") {
                particleSystem.material.color.setHex(0x00ffff);
                const pos = particleSystem.geometry.attributes.position.array;
                for (let i = 0; i < pos.length/3; i++) { pos[i * 3 + 1] += Math.sin(i * 0.1 + waveClock * 8) * 0.1; }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            } else if (animationStatus === "SEARCHING") {
                particleSystem.material.color.setHex(0xff00ff);
                particleSystem.rotation.x += 0.06;
            } else if (animationStatus === "THINKING") {
                particleSystem.material.color.setHex(0xff0044);
                particleSystem.rotation.x += 0.04;
            } else if (animationStatus === "LISTENING") {
                particleSystem.material.color.setHex(0xffaa00);
            } else {
                particleSystem.material.color.setHex(0x00d2ff);
            }
            renderer.render(scene, camera);
        }

        // --- Mark IX 空间感知控制（双手操纵透视与视线平移） ---
        async function bootMarkIX() {
            document.getElementById('start-shield').style.display = 'none';
            init3DMatrix();
            
            // 🌟 杀招一：激活瞬间强制注入隐形音频，彻底强行轰开 Chrome 硬件锁
            let initAudioLock = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(initAudioLock);

            const videoElement = document.getElementById('webcam');
            const gestureLabel = document.getElementById('gesture-status');
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
                    const hand1 = results.multiHandLandmarks[0][9];
                    const hand2 = results.multiHandLandmarks[1][9];
                    const dist2D = Math.sqrt(Math.pow(hand1.x - hand2.x, 2) + Math.pow(hand1.y - hand2.y, 2));
                    const midpointX = (hand1.x + hand2.x) / 2;
                    const midpointY = (hand1.y + hand2.y) / 2;

                    const hand1Pinch = Math.sqrt(Math.pow(results.multiHandLandmarks[0][4].x - results.multiHandLandmarks[0][8].x, 2) + Math.pow(results.multiHandLandmarks[0][4].y - results.multiHandLandmarks[0][8].y, 2)) < 0.05;
                    const hand2Pinch = Math.sqrt(Math.pow(results.multiHandLandmarks[1][4].x - results.multiHandLandmarks[1][8].x, 2) + Math.pow(results.multiHandLandmarks[1][4].y - results.multiHandLandmarks[1][8].y, 2)) < 0.05;

                    if (hand1Pinch && hand2Pinch) {
                        // ✋ 场景 A：双手捏合 -> 电影级“锁定拖拽地图平移”
                        gestureLabel.innerText = "MARK IX: HOLO-PANNING (双手空间视窗移动)";
                        particleSystem.material.color.setHex(0x00ffcc);
                        camera.position.x += ((0.5 - midpointX) * 240 - camera.position.x) * 0.15;
                        camera.position.y += ((0.5 - midpointY) * -200 - camera.position.y) * 0.15;
                    } else {
                        // ✋ 场景 B：双手拉伸 -> 电影级“透视推近放大/拉远”
                        gestureLabel.innerText = "MARK IX: SPATIAL ZOOM (双手多维空间透视中)";
                        particleSystem.material.color.setHex(0xffaa00);
                        const targetZ = originalCameraPosition.z - (dist2D * 350 - 60);
                        camera.position.z += (Math.max(40, targetZ) - camera.position.z) * 0.1;
                    }
                } else if (results.multiHandLandmarks && results.multiHandLandmarks.length === 1) {
                    const lm = results.multiHandLandmarks[0];
                    const pinchDist = Math.sqrt(Math.pow(lm[4].x - lm[8].x, 2) + Math.pow(lm[4].y - lm[8].y, 2));
                    if (pinchDist < 0.05) {
                        gestureLabel.innerText = "SPATIAL SENSOR: SNAPSHOT (空气抓取数据)";
                        particleSystem.material.color.setHex(0x00ffcc);
                        if(!isTaskLock) {
                            isTaskLock = true;
                            setTimeout(() => {
                                const link = document.createElement('a'); link.download = `jarvis_scan.png`; link.href = renderer.domElement.toDataURL(); link.click();
                            }, 400);
                        }
                    } else {
                        gestureLabel.innerText = "SPATIAL SENSOR: TRACKING (单手追踪)";
                        isTaskLock = false;
                    }
                } else {
                    gestureLabel.innerText = "SPATIAL SENSOR: SCANNING...";
                    particleSystem.material.color.setHex(0x00d2ff);
                    camera.position.lerp(originalCameraPosition, 0.1); 
                }
            });
            const cameraHelper = new Camera(videoElement, { onFrame: async () => { await hands.send({ image: videoElement }); }, width: 640, height: 480 });
            cameraHelper.start();

            initFullDuplexBrain();
        }

        // --- 实时联网嗅探 ---
        async function performLiveWebSearch(query) {
            const matrix = document.getElementById('thinking-matrix');
            matrix.innerHTML = `[NET_SCANNING] 🛰️ 正在攻破广域网端口...<br>[INFO] 嗅探关键词: "${query}"`;
            try {
                const response = await fetch('https://api.tavily.com/search', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_key: TAVILY_API_KEY, query: query, search_depth: "basic", include_answer: true, max_results: 3 })
                });
                const data = await response.json();
                matrix.innerHTML += `<br><span style="color:#00ff00">[SUCCESS] 网络情报回传成功。送往推理矩阵。</span><br>`;
                let context = `【系统全网实时数据】\n直接结论：${data.answer || '暂无'}\n来源摘要：\n`;
                data.results.forEach(res => { context += `- ${res.title}: ${res.content}\n`; });
                return context;
            } catch (error) { return null; }
        }

        // --- 🌟 终极：全双工神经网络打断与 R1 思维流解析 ---
        function initFullDuplexBrain() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = true;  
            recognition.interimResults = false;

            recognition.onresult = async (event) => {
                const text = event.results[event.results.length - 1][0].transcript;
                if (!text.trim()) return;

                // 🌟 小爱同学级瞬间打断：开口即静音，清空过载
                if(window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                    console.log("CRITICAL: 施法已被先生中途打断。");
                }

                document.getElementById('subtitle-box').innerText = "Sir: " + text;
                const matrix = document.getElementById('thinking-matrix');
                matrix.innerHTML = `[JARVIS CENTRAL BRAIN] 🧠 收到指令。启动长考机制...<br>`;
                
                let finalPrompt = text;
                if (text.includes("查") || text.includes("最新") || text.includes("今天") || text.includes("预测") || text.includes("新闻")) {
                    animationStatus = "SEARCHING";
                    document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: SCANNING GLOBAL NET...";
                    const webContext = await performLiveWebSearch(text);
                    if (webContext) finalPrompt = `${webContext}\n\n先生的问题是：${text}\n请基于上述全网情报向先生作答。不要带有Markdown。`;
                }

                animationStatus = "THINKING";
                document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: COGNITIVE THINKING...";

                messages.push({"role": "user", "content": finalPrompt});
                try {
                    const response = await fetch('https://api.siliconflow.cn/v1/chat/completions', {
                        method: 'POST', headers: { 'Authorization': `Bearer ${DEEPSEEK_API_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model: MODEL_ID, messages: messages, temperature: 0.6 })
                    });
                    
                    const data = await response.json();
                    const rawReply = data.choices[0].message.content;
                    
                    // 🌟 核心硬核魔改：解算 DeepSeek-R1 专属的思维链模型
                    let thinkPart = "解算完毕。";
                    let finalReply = rawReply;
                    
                    if (rawReply.includes("<think>")) {
                        let segments = rawReply.split("</think>");
                        thinkPart = segments[0].replace("<think>", "").trim();
                        finalReply = segments[1] ? segments[1].trim() : "长考异常。";
                    }
                    
                    // 动态流式打入左侧科幻计算栏
                    matrix.innerHTML = `<span style="color:#00ff00">[思维计算完毕] 维度解算过程：</span><br>${thinkPart}`;
                    matrix.scrollTop = matrix.scrollHeight; // 滚动条置底

                    messages.pop(); 
                    messages.push({"role": "user", "content": text});
                    messages.push({"role": "assistant", "content": finalReply});
                    
                    jarvisSpeak(finalReply);
                } catch(e) { jarvisSpeak("云端算力过载，先生。请确认云端燃料储备。"); }
            };

            recognition.onend = () => { setTimeout(() => { recognition.start(); }, 100); };
            recognition.start();
            document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: LISTENING...";
            animationStatus = "LISTENING";
            
            setTimeout(() => {
                jarvisSpeak("双手全息空间控制协议已合闸。思维计算矩阵已并网。随时可以打断我，先生。");
            }, 1200);
        }

        // --- 🌟 强制发声抗死锁机制 ---
        function jarvisSpeak(text) {
            document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: SPEAKING";
            document.getElementById('subtitle-box').innerText = "JARVIS: " + text;
            animationStatus = "SPEAKING";

            window.speechSynthesis.cancel(); // 暴力清空堆栈
            
            // 🌟 杀招二：将 Utterance 挂载至 Window 全局变量，彻底摧毁浏览器静音垃圾回收机制
            window.currentUtterance = new SpeechSynthesisUtterance(text);
            window.currentUtterance.lang = 'zh-CN'; 
            
            // 🌟 杀招三：强行过滤并拉取 Windows 系统 100% 具备的本地微软离线语音包，决不走 Google 线上
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.lang.includes('zh') && (v.name.includes('Microsoft') || v.name.includes('Huihui') || v.name.includes('Kangkang')));
            if(preferredVoice) window.currentUtterance.voice = preferredVoice;
            
            window.currentUtterance.rate = 1.05; 
            window.currentUtterance.pitch = 0.95; 
            
            window.currentUtterance.onend = () => {
                document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: LISTENING (待命)";
                animationStatus = "LISTENING";
                particleSystem.material.color.setHex(0x00d2ff);
            };
            
            window.speechSynthesis.speak(window.currentUtterance);
            
            // 🌟 杀招四：强效保活心跳
            if (window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            }
        }
    </script>
</body>
</html>
