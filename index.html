<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>JARVIS OMNISCIENT AGENT v5.0</title>
    <style>
        body { background-color: #01040a; margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; color: #00d2ff; }
        #canvas-zone { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #webcam { position: absolute; top: 40px; right: 40px; width: 220px; height: 165px; z-index: 20; border: 2px solid #00d2ff; transform: scaleX(-1); border-radius: 8px; background: #000; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); }
        .hud-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        #sys-status { position: absolute; top: 40px; left: 40px; font-size: 26px; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 10px #00d2ff; }
        #gesture-status { position: absolute; top: 80px; left: 40px; font-size: 16px; color: #00ffcc; text-shadow: 0 0 5px #00ffcc; font-weight: bold; }
        #network-logger { position: absolute; top: 120px; left: 40px; font-size: 14px; color: #ff00ff; font-family: 'Courier New', monospace; max-width: 400px; line-height: 1.6; text-shadow: 0 0 5px #ff00ff; }
        #subtitle-box { position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); width: 70%; text-align: center; font-size: 22px; color: #ffffff; text-shadow: 0 0 12px #00d2ff; line-height: 1.5; }
        #panel { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(0, 210, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.2); padding: 15px 30px; border-radius: 8px; font-size: 14px; text-align: center; pointer-events: auto; }
        #start-shield { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #01040a; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .btn { padding: 20px 40px; border: 2px solid #00d2ff; background: rgba(0, 210, 255, 0.1); color: #00d2ff; font-size: 20px; font-weight: bold; letter-spacing: 2px; box-shadow: 0 0 30px rgba(0, 210, 255, 0.3); border-radius: 4px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="start-shield" onclick="bootOmniscientJarvis()">
        <div class="btn">启动 v5.0 全知云端中枢</div>
        <p style="margin-top: 20px; font-size: 14px; color: #555;">[首次启动需要加载视觉模型，点击后请稍候 3-5 秒]</p>
    </div>

    <div id="canvas-zone"></div>
    <video id="webcam" autoplay playsinline></video>

    <div class="hud-overlay">
        <div id="sys-status">JARVIS CORE: OFFLINE</div>
        <div id="gesture-status">OPTICAL SENSOR: OFFLINE</div>
        <div id="network-logger"></div>
        <div id="subtitle-box"></div>
        <div id="panel">🌐 实时联网全知模式 | 键盘 <b>F11</b> 全屏 | 对话包含 <b>"查一下"</b>、<b>"最新"</b> 自动触发全网扫描<br>✋ 手势指令：<b>双指捏合</b> 隔空截图 | <b>大拇指朝上</b> 自动生成工程代码</div>
    </div>

    <script>
        // 🚨 极其重要：在这里替换你的密钥！保留引号！
        const DEEPSEEK_API_KEY = "sk-joikwvbzzgcfhbdyiwnrkiwkvxgisedoirvstkqsysdzsfiw";

        // 🌐 联网模块密钥
        const TAVILY_API_KEY = "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";

        const MODEL_ID = "deepseek-ai/DeepSeek-V3";
        let messages = [{
            "role": "system",
            "content": "你现在是贾维斯（JARVIS），《钢铁侠》中托尼·斯塔克的全能人工智能助理。必须称呼用户为“先生（Sir）”，语气冷静、自信、极度聪明且绝对忠诚。请保持精炼，严禁带任何 Markdown 符号。当提供检索数据时，请直接汇报结论。"
        }];

        let scene, camera, renderer, particleSystem;
        let animationStatus = "IDLE";
        let waveClock = 0;
        let targetScale = 1, currentScale = 1;
        let isTaskLock = false;

        // --- 1. 3D 反应堆渲染引擎 ---
        function init3DEngine() {
            const zone = document.getElementById('canvas-zone');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 220;
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            zone.appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(3000 * 3);
            for (let i = 0; i < 3000; i++) {
                const theta = Math.random() * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * Math.random() - 1.0);
                const r = 90 + Math.random() * 5;
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: 0x00d2ff, size: 1.8, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending });
            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            waveClock += 0.05;
            particleSystem.rotation.y += 0.003;
            currentScale += (targetScale - currentScale) * 0.15;
            particleSystem.scale.set(currentScale, currentScale, currentScale);

            if (animationStatus === "SPEAKING") {
                particleSystem.material.color.setHex(0x00ffff);
                const pos = particleSystem.geometry.attributes.position.array;
                for (let i = 0; i < pos.length/3; i++) { pos[i * 3 + 1] += Math.sin(i * 0.1 + waveClock * 8) * 0.1; }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            } else if (animationStatus === "SEARCHING") {
                particleSystem.material.color.setHex(0xff00ff);
                particleSystem.rotation.x += 0.08;
                particleSystem.rotation.y -= 0.05;
            } else if (animationStatus === "THINKING") {
                particleSystem.material.color.setHex(0xff0055);
                particleSystem.rotation.x += 0.05;
            } else if (animationStatus === "LISTENING") {
                particleSystem.material.color.setHex(0xffaa00);
            } else {
                if(targetScale === 1) particleSystem.material.color.setHex(0x00d2ff);
            }
            renderer.render(scene, camera);
        }

        // --- 2. 核心启动器与视觉手势捕捉 ---
        async function bootOmniscientJarvis() {
            document.getElementById('start-shield').style.display = 'none';
            init3DEngine();

            const videoElement = document.getElementById('webcam');
            const gestureLabel = document.getElementById('gesture-status');
            const logger = document.getElementById('network-logger');
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    gestureLabel.innerText = "OPTICAL TRACKING: LOCKED";
                    const lm = results.multiHandLandmarks[0];

                    // 手势识别逻辑
                    const pinchDist = Math.sqrt(Math.pow(lm[4].x - lm[8].x, 2) + Math.pow(lm[4].y - lm[8].y, 2));
                    const isThumbUp = lm[4].y < lm[3].y && lm[3].y < lm[5].y && lm[8].x > lm[6].x;

                    if (pinchDist < 0.05) {
                        targetScale = 0.5; particleSystem.material.color.setHex(0x00ffcc);
                        if(!isTaskLock) {
                            isTaskLock = true;
                            logger.innerHTML += `[SYSTEM] ⚙️ 执行隔空截图...<br>`;
                            setTimeout(() => {
                                const link = document.createElement('a'); link.download = `jarvis_snapshot.png`; link.href = renderer.domElement.toDataURL(); link.click();
                            }, 300);
                        }
                    } else if (isThumbUp) {
                        targetScale = 1.2; particleSystem.material.color.setHex(0xffaa00);
                        if(!isTaskLock) {
                            isTaskLock = true;
                            logger.innerHTML += `[SYSTEM] ⚙️ 生成工程代码...<br>`;
                            setTimeout(() => {
                                const code = `import numpy as np\ndef main():\n    print("JARVIS ENGINE")\nif __name__ == '__main__':\n    main()`;
                                const blob = new Blob([code], { type: 'text/plain' });
                                const link = document.createElement('a'); link.download = `jarvis_engine.py`; link.href = URL.createObjectURL(blob); link.click();
                            }, 300);
                        }
                    } else {
                        targetScale = 1.0;
                        isTaskLock = false;
                    }
                } else {
                    gestureLabel.innerText = "OPTICAL TRACKING: SCANNING...";
                    targetScale = 1.0;
                }
            });
            const cameraHelper = new Camera(videoElement, { onFrame: async () => { await hands.send({ image: videoElement }); }, width: 640, height: 480 });
            cameraHelper.start();

            initVoiceAndBrainEngine();
        }

        // --- 3. 实时联网嗅探模块 ---
        async function performLiveWebSearch(query) {
            document.getElementById('network-logger').innerHTML = `[NETWORK] 🛰️ 正在扫描全球互联网节点...<br>关键词: "${query}"`;
            try {
                const response = await fetch('https://api.tavily.com/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_key: TAVILY_API_KEY, query: query, search_depth: "basic", include_answer: true, max_results: 3 })
                });
                const data = await response.json();
                document.getElementById('network-logger').innerHTML += `<br><span style="color:#00ff00">[SUCCESS] 抓取到最新情报。</span>`;

                let context = `【系统全网实时抓取数据】\n直接答案：${data.answer || '无直接答案'}\n来源摘要：\n`;
                data.results.forEach(res => { context += `- ${res.title}: ${res.content}\n`; });
                return context;
            } catch (error) {
                document.getElementById('network-logger').innerHTML += `<br><span style="color:red">[ERROR] 无法连接外部网络。</span>`;
                return null;
            }
        }

        // --- 4. 听觉与思维中枢 ---
        function initVoiceAndBrainEngine() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = async (event) => {
                const text = event.results[event.results.length - 1][0].transcript;
                if (!text.trim()) return;

                window.speechSynthesis.cancel(); // 随时打断正在说的话

                document.getElementById('subtitle-box').innerText = "Sir: " + text;
                let finalPrompt = text;

                // 智能调度：判断是否需要联网
                if (text.includes("查") || text.includes("最新") || text.includes("今天") || text.includes("谁是")) {
                    animationStatus = "SEARCHING";
                    document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: BROWSING THE WEB (正在扫描全网...)";
                    const webContext = await performLiveWebSearch(text);
                    if (webContext) finalPrompt = `${webContext}\n\n先生的问题是：${text}\n请根据上述最新情报进行精准汇报，不要提及你是根据文本回答的，假装这就是你知道的情报。`;
                }

                animationStatus = "THINKING";
                document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: THINKING (思考与整合中...)";

                messages.push({"role": "user", "content": finalPrompt});
                try {
                    const response = await fetch('https://api.siliconflow.cn/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${DEEPSEEK_API_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model: MODEL_ID, messages: messages, temperature: 0.4 })
                    });
                    const data = await response.json();
                    const jarvisReply = data.choices[0].message.content;

                    messages.pop(); // 剔除后台提示词
                    messages.push({"role": "user", "content": text});
                    messages.push({"role": "assistant", "content": jarvisReply});

                    jarvisSpeak(jarvisReply);
                } catch(e) { jarvisSpeak("报告先生，中枢链路波动，请确认网络状态。"); }
            };

            recognition.onend = () => { setTimeout(() => { recognition.start(); }, 200); };
            recognition.start();
            document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: LISTENING (全天候聆听中...)";
            animationStatus = "LISTENING";
        }

        // --- 5. 发声组件 ---
        function jarvisSpeak(text) {
            document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: SPEAKING";
            document.getElementById('subtitle-box').innerText = "JARVIS: " + text;
            animationStatus = "SPEAKING";

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.lang.includes('zh') && v.name.includes('Google')) || voices[0];
            if(preferredVoice) utterance.voice = preferredVoice;

            utterance.rate = 1.05; utterance.pitch = 0.92;
            utterance.onend = () => {
                document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: LISTENING (全天候聆听中...)";
                animationStatus = "LISTENING";
                document.getElementById('network-logger').innerHTML = ""; // 播报完毕清空网络日志
            };
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
