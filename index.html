<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>JARVIS MARK VI - HOLOGRAPHIC OS</title>
    <style>
        body { background-color: #01040a; margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; color: #00d2ff; }
        #canvas-zone { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        /* 摄像头变成科幻雷达视窗 */
        #webcam { position: absolute; top: 40px; right: 40px; width: 240px; height: 180px; z-index: 20; border: 2px solid rgba(0, 210, 255, 0.5); transform: scaleX(-1); border-radius: 12px; filter: grayscale(100%) contrast(120%) drop-shadow(0 0 15px rgba(0,210,255,0.4)); }
        .hud-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        #sys-status { position: absolute; top: 40px; left: 40px; font-size: 28px; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 15px #00d2ff; }
        #gesture-status { position: absolute; top: 85px; left: 40px; font-size: 18px; color: #ffaa00; text-shadow: 0 0 8px #ffaa00; font-weight: bold; letter-spacing: 1px; }
        #network-logger { position: absolute; top: 130px; left: 40px; font-size: 15px; color: #00ffcc; font-family: 'Courier New', monospace; max-width: 450px; line-height: 1.6; text-shadow: 0 0 5px #00ffcc; }
        #subtitle-box { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); width: 75%; text-align: center; font-size: 24px; color: #ffffff; text-shadow: 0 0 15px #00d2ff; line-height: 1.5; font-weight: 600; }
        #panel { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(0, 210, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.3); padding: 15px 40px; border-radius: 10px; font-size: 15px; text-align: center; pointer-events: auto; backdrop-filter: blur(4px); }
        #start-shield { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #01040a; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .btn { padding: 25px 50px; border: 2px solid #00d2ff; background: rgba(0, 210, 255, 0.1); color: #00d2ff; font-size: 22px; font-weight: bold; letter-spacing: 3px; box-shadow: 0 0 40px rgba(0, 210, 255, 0.4); border-radius: 6px; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { background: rgba(0, 210, 255, 0.3); box-shadow: 0 0 60px #00d2ff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="start-shield" onclick="bootMarkVI()">
        <div class="btn">启动 MARK VI 全息矩阵 (INITIALIZE)</div>
        <p style="margin-top: 25px; font-size: 14px; color: #555;">[点击后请授权麦克风与摄像头，加载神经模型需 3-5 秒]</p>
    </div>

    <div id="canvas-zone"></div>
    <video id="webcam" autoplay playsinline></video>

    <div class="hud-overlay">
        <div id="sys-status">JARVIS MARK VI: OFFLINE</div>
        <div id="gesture-status">SPATIAL SENSOR: OFFLINE</div>
        <div id="network-logger"></div>
        <div id="subtitle-box"></div>
        <div id="panel">
            🌐 <b>智能全知舱</b> | 包含"查一下/最新"自动全网抓取 | F11 全屏<br>
            ✋ <b>空间交互指令</b>：[张开手] 悬浮跟随 | [用力握拳] 警戒坍缩 | [快速挥手] 清空屏幕日志
        </div>
    </div>

    <script>
        // 🚨 警告：请填入全新的密钥！之前截图里的已泄露！
        const DEEPSEEK_API_KEY = "sk-joikwvbzzgcfhbdyiwnrkiwkvxgisedoirvstkqsysdzsfiw";
        const TAVILY_API_KEY = "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"; 
        
        const MODEL_ID = "deepseek-ai/DeepSeek-V3";
        let messages = [{"role": "system", "content": "你是贾维斯(JARVIS)，托尼·斯塔克的全能AI助理。称呼用户为“先生(Sir)”。语气冷静、极度聪明、绝对忠诚。回答精炼，严禁Markdown符号。"}];

        // --- 核心全息状态参数 ---
        let scene, camera, renderer, particleSystem;
        let animationStatus = "IDLE"; 
        let waveClock = 0;
        let targetScale = 1, currentScale = 1;
        
        // 🌟 物理空间映射变量：让 3D 球跟着手走
        let targetPosX = 0, targetPosY = 0;
        let lastHandX = 0; // 用于计算挥手速度

        function init3DEngine() {
            const zone = document.getElementById('canvas-zone');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 240;
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            zone.appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(3500 * 3);
            for (let i = 0; i < 3500; i++) {
                const theta = Math.random() * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * Math.random() - 1.0);
                const r = 95 + Math.random() * 5;
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: 0x00d2ff, size: 1.8, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            waveClock += 0.05;
            particleSystem.rotation.y += 0.003;
            
            // 🌟 空间阻尼跟随算法：让球体平滑地追随手掌坐标
            particleSystem.position.x += (targetPosX - particleSystem.position.x) * 0.08;
            particleSystem.position.y += (targetPosY - particleSystem.position.y) * 0.08;
            currentScale += (targetScale - currentScale) * 0.15;
            particleSystem.scale.set(currentScale, currentScale, currentScale);
            
            // 多重状态视觉爆燃
            if (animationStatus === "SPEAKING") {
                particleSystem.material.color.setHex(0x00ffff);
                const pos = particleSystem.geometry.attributes.position.array;
                for (let i = 0; i < pos.length/3; i++) { pos[i * 3 + 1] += Math.sin(i * 0.1 + waveClock * 8) * 0.15; }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            } else if (animationStatus === "SEARCHING") {
                particleSystem.material.color.setHex(0xb200ff);
                particleSystem.rotation.x += 0.1;
                particleSystem.rotation.y -= 0.08;
            } else if (animationStatus === "THINKING") {
                particleSystem.material.color.setHex(0xff0044);
                particleSystem.rotation.x += 0.06;
            } else if (animationStatus === "LISTENING") {
                particleSystem.material.color.setHex(0xffaa00);
            } else {
                if(targetScale === 1) particleSystem.material.color.setHex(0x00d2ff);
            }
            renderer.render(scene, camera);
        }

        // --- 高级空间感知系统 (MARK VI 交互核心) ---
        async function bootMarkVI() {
            document.getElementById('start-shield').style.display = 'none';
            init3DEngine();
            
            // 强制唤醒浏览器语音模块，准备发声
            const initUtterance = new SpeechSynthesisUtterance("系统启动中");
            initUtterance.volume = 0;
            window.speechSynthesis.speak(initUtterance);

            const videoElement = document.getElementById('webcam');
            const gestureLabel = document.getElementById('gesture-status');
            const logger = document.getElementById('network-logger');
            
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    
                    // 🌟 1. 悬浮跟随算法：提取掌心坐标映射到屏幕 3D 空间
                    const handCenterX = lm[9].x; // 中指根部作为掌心中心
                    const handCenterY = lm[9].y;
                    targetPosX = (0.5 - handCenterX) * 280; // 左右平移
                    targetPosY = (0.5 - handCenterY) * -200; // 上下平移 (3D世界的Y轴相反)

                    // 🌟 2. 战术握拳识别：判断所有指尖是否都低于手指关节
                    const isFist = (lm[8].y > lm[5].y) && (lm[12].y > lm[9].y) && (lm[16].y > lm[13].y) && (lm[20].y > lm[17].y);
                    
                    // 🌟 3. 凌空挥手识别：计算手掌 X 轴瞬时位移速度
                    const speedX = handCenterX - lastHandX;
                    lastHandX = handCenterX;

                    if (Math.abs(speedX) > 0.08) {
                        // 挥手瞬间：清空日志！
                        gestureLabel.innerText = "SPATIAL COMMAND: SWIPE (执行屏幕清理)";
                        logger.innerHTML = "";
                        particleSystem.material.color.setHex(0x00ff00);
                        targetPosX += speedX > 0 ? -100 : 100; // 球体受到物理冲击
                    } else if (isFist) { 
                        // 握拳瞬间：高能警戒！
                        gestureLabel.innerText = "SPATIAL COMMAND: SHIELD LOCK (防御态势锁定)";
                        targetScale = 0.4; 
                        particleSystem.material.color.setHex(0xff0000); 
                    } else {
                        // 张开手掌：优雅跟随！
                        gestureLabel.innerText = "SPATIAL SENSOR: TRACKING (全息阵列已锁定)";
                        targetScale = 1.0; 
                    }
                } else {
                    gestureLabel.innerText = "SPATIAL SENSOR: SCANNING... (等待手势接入)";
                    targetScale = 1.0;
                    targetPosX = 0; // 手移开屏幕，球体平滑归位中心
                    targetPosY = 0;
                }
            });
            const cameraHelper = new Camera(videoElement, { onFrame: async () => { await hands.send({ image: videoElement }); }, width: 640, height: 480 });
            cameraHelper.start();

            initVoiceAndBrainEngine();
        }

        // --- 实时联网嗅探 ---
        async function performLiveWebSearch(query) {
            const logger = document.getElementById('network-logger');
            logger.innerHTML = `[NETWORK] 🛰️ 正在黑入全球卫星节点...<br>嗅探目标: "${query}"`;
            try {
                const response = await fetch('https://api.tavily.com/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_key: TAVILY_API_KEY, query: query, search_depth: "basic", include_answer: true, max_results: 3 })
                });
                const data = await response.json();
                logger.innerHTML += `<br><span style="color:#00ff00">[SUCCESS] 情报解密完成。移交主脑。</span>`;
                
                let context = `【系统全网实时抓取数据】\n直接答案：${data.answer || '无直接答案'}\n情报来源：\n`;
                data.results.forEach(res => { context += `- ${res.title}: ${res.content}\n`; });
                return context;
            } catch (error) {
                logger.innerHTML += `<br><span style="color:red">[ERROR] 遭遇防火墙拦截，转为离线思考。</span>`;
                return null;
            }
        }

        // --- 多模态打断与思考中枢 ---
        function initVoiceAndBrainEngine() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = true; 
            recognition.interimResults = false;

            recognition.onresult = async (event) => {
                const text = event.results[event.results.length - 1][0].transcript;
                if (!text.trim()) return;

                // 🌟 小爱同学级打断：你一说话，立马掐断语音引擎！
                window.speechSynthesis.cancel(); 

                document.getElementById('subtitle-box').innerText = "Sir: " + text;
                let finalPrompt = text;

                if (text.includes("查") || text.includes("最新") || text.includes("今天") || text.includes("谁是") || text.includes("新闻")) {
                    animationStatus = "SEARCHING";
                    document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: BROWSING (正在嗅探全网...)";
                    const webContext = await performLiveWebSearch(text);
                    if (webContext) finalPrompt = `${webContext}\n\n先生的问题是：${text}\n请根据上述情报向先生作答。不要提你是根据文本回答的，直接陈述事实。`;
                }

                animationStatus = "THINKING";
                document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: THINKING (量子网络运算中...)";

                messages.push({"role": "user", "content": finalPrompt});
                try {
                    const response = await fetch('https://api.siliconflow.cn/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${DEEPSEEK_API_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model: MODEL_ID, messages: messages, temperature: 0.4 })
                    });
                    const data = await response.json();
                    const jarvisReply = data.choices[0].message.content;
                    
                    messages.pop(); 
                    messages.push({"role": "user", "content": text});
                    messages.push({"role": "assistant", "content": jarvisReply});
                    
                    robustSpeak(jarvisReply);
                } catch(e) { robustSpeak("先生，云端算力节点发生抖动。"); }
            };

            recognition.onend = () => { setTimeout(() => { recognition.start(); }, 200); };
            recognition.start();
            document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: LISTENING (全天候待命...)";
            animationStatus = "LISTENING";
        }

        // --- 🌟 强制暴力的防死锁发声引擎 ---
        function robustSpeak(text) {
            document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: SPEAKING";
            document.getElementById('subtitle-box').innerText = "JARVIS: " + text;
            animationStatus = "SPEAKING";

            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            
            // 确保加载语音库
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.lang.includes('zh') && (v.name.includes('Google') || v.name.includes('Xiaoxiao'))) || voices[0];
            if(preferredVoice) utterance.voice = preferredVoice;
            
            utterance.rate = 1.05; 
            utterance.pitch = 0.9;
            
            // 击穿 Chrome 语音中断 BUG 的强制保活心跳
            let keepAliveTimer = setInterval(() => { window.speechSynthesis.resume(); }, 4000);

            utterance.onend = () => {
                clearInterval(keepAliveTimer);
                document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: LISTENING (全天候待命...)";
                animationStatus = "LISTENING";
            };
            
            utterance.onerror = (e) => {
                clearInterval(keepAliveTimer);
                animationStatus = "LISTENING";
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
