<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>JARVIS MARK VIII - HOLO-TERMINAL</title>
    <style>
        body { background-color: #01040a; margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; color: #00d2ff; user-select: none; }
        #canvas-zone { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #webcam { position: absolute; top: 40px; right: 40px; width: 260px; height: 195px; z-index: 20; border: 2px solid rgba(0, 210, 255, 0.4); transform: scaleX(-1); border-radius: 12px; filter: grayscale(80%) contrast(120%) drop-shadow(0 0 20px rgba(0,210,255,0.3)); }
        .hud-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        #sys-status { position: absolute; top: 40px; left: 40px; font-size: 28px; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 15px #00d2ff; }
        #gesture-status { position: absolute; top: 85px; left: 40px; font-size: 18px; color: #ffaa00; text-shadow: 0 0 8px #ffaa00; font-weight: bold; }
        #network-logger { position: absolute; top: 120px; left: 40px; font-size: 15px; color: #ff0055; font-weight: bold; display: none; text-shadow: 0 0 10px #ff0055; }
        #subtitle-box { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); width: 80%; text-align: center; font-size: 24px; color: #ffffff; text-shadow: 0 0 15px #00d2ff; font-weight: 600; line-height: 1.6; }
        #panel { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0, 210, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.3); padding: 15px 40px; border-radius: 10px; font-size: 15px; text-align: center; backdrop-filter: blur(5px); }
        #start-shield { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #01040a; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .btn { padding: 25px 50px; border: 2px solid #00d2ff; background: rgba(0, 210, 255, 0.1); color: #00d2ff; font-size: 22px; font-weight: bold; letter-spacing: 3px; box-shadow: 0 0 40px rgba(0, 210, 255, 0.4); border-radius: 6px; transition: 0.3s; }
        .btn:hover { background: rgba(0, 210, 255, 0.3); box-shadow: 0 0 60px #00d2ff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="start-shield" onclick="bootMarkVIII()">
        <div class="btn">授权载入 MARK VIII 并网阵列</div>
    </div>

    <div id="canvas-zone"></div>
    <video id="webcam" autoplay playsinline></video>

    <div class="hud-overlay">
        <div id="sys-status">JARVIS MARK VIII: OFFLINE</div>
        <div id="gesture-status">SPATIAL SENSOR: OFFLINE</div>
        <div id="network-logger"></div>
        <div id="subtitle-box"></div>
        <div id="panel">
            <b>【Mark VIII 双手全息控制协议】</b> F11 全屏<br>
            伸出两只手：双手拉开/拉近 = 解析放大/缩小视角 | 双手捏合 = 锁定抓取并平移全息视角
        </div>
    </div>

    <script>
        // 🚨 极其重要：在这里替换你的密钥！保留引号！不要发在这个对话框里！
        const DEEPSEEK_API_KEY = "sk-joikwvbzzgcfhbdyiwnrkiwkvxgisedoirvstkqsysdzsfiw";
        const TAVILY_API_KEY = "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"; 
        
        const MODEL_ID = "deepseek-ai/DeepSeek-V3";
        let messages = [{"role": "system", "content": "你是贾维斯(JARVIS)，极度聪明的AI助理。称呼用户为“先生(Sir)”。严格要求：回答极度精炼口语化，像人类对话，不要超过三句话，严禁出现Markdown和长篇大论。当检索到数据时，直接陈述结论，假装这就是你知道的情报。"}];

        // --- 全息 3D 渲染核心 (Mark VIII 空间控制增强版) ---
        let scene, camera, renderer, particleSystem;
        let animationStatus = "IDLE"; 
        let waveClock = 0;
        let originalCameraPosition = new THREE.Vector3(0, 0, 240); // 记录摄像机原始位置
        let isTaskLock = false;

        function init3DEngine() {
            const zone = document.getElementById('canvas-zone');
            scene = new THREE.Scene();
            
            // 🌟 摄像机属性初始化：我们需要它能够进行高频解析和视角控制
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.copy(originalCameraPosition);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            zone.appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(4500 * 3); // 粒子浓度增加到4500个，提升解析度
            for (let i = 0; i < 4500; i++) {
                const theta = Math.random() * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * Math.random() - 1.0);
                const r = 95 + Math.random() * 8;
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: 0x00d2ff, size: 1.5, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            waveClock += 0.05;
            particleSystem.rotation.y += 0.002;
            
            if (animationStatus === "SPEAKING") {
                particleSystem.material.color.setHex(0x00ffff);
                const pos = particleSystem.geometry.attributes.position.array;
                for (let i = 0; i < pos.length/3; i++) { pos[i * 3 + 1] += Math.sin(i * 0.1 + waveClock * 8) * 0.1; }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            } else if (animationStatus === "SEARCHING") {
                particleSystem.material.color.setHex(0xff00ff);
                particleSystem.rotation.x += 0.06;
            } else if (animationStatus === "THINKING") {
                particleSystem.material.color.setHex(0xff0044);
                particleSystem.rotation.x += 0.04;
            } else if (animationStatus === "LISTENING") {
                particleSystem.material.color.setHex(0xffaa00);
            } else {
                particleSystem.material.color.setHex(0x00d2ff);
            }
            renderer.render(scene, camera);
        }

        // --- Mark VIII 空间感知交互系统（控制摄像机实现电影级缩放/平移） ---
        async function bootMarkVIII() {
            document.getElementById('start-shield').style.display = 'none';
            init3DEngine();
            
            // 🌟 终极暴力防哑巴协议：在点击瞬间强制注入隐形音频，彻底冲破 Chrome 哑巴锁！
            let forceVoiceChannel = new SpeechSynthesisUtterance("");
            forceVoiceChannel.volume = 0;
            window.speechSynthesis.speak(forceVoiceChannel);

            const videoElement = document.getElementById('webcam');
            const gestureLabel = document.getElementById('gesture-status');
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            
            // 🌟 核心升级：双手捕捉 maxNumHands: 2
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
                    // 🌟 1. 双手模式：电影里一样的双手全息空间控制！
                    const hand1 = results.multiHandLandmarks[0][9]; // 左手中心
                    const hand2 = results.multiHandLandmarks[1][9]; // 右手中心
                    // 计算双手在 2D 空间的欧氏距离
                    const dist2D = Math.sqrt(Math.pow(hand1.x - hand2.x, 2) + Math.pow(hand1.y - hand2.y, 2));
                    
                    // 计算双手的中心点，用于视角平移
                    const midpointX = (hand1.x + hand2.x) / 2;
                    const midpointY = (hand1.y + hand2.y) / 2;

                    // 判断双手是否都在做“捏合”暗号
                    const hand1Pinch = Math.sqrt(Math.pow(results.multiHandLandmarks[0][4].x - results.multiHandLandmarks[0][8].x, 2) + Math.pow(results.multiHandLandmarks[0][4].y - results.multiHandLandmarks[0][8].y, 2)) < 0.05;
                    const hand2Pinch = Math.sqrt(Math.pow(results.multiHandLandmarks[1][4].x - results.multiHandLandmarks[1][8].x, 2) + Math.pow(results.multiHandLandmarks[1][4].y - results.multiHandLandmarks[1][8].y, 2)) < 0.05;

                    if (hand1Pinch && hand2Pinch) {
                        // 🌟 交互状态 A：双手捏合 -> “选取并平移视角”（在地图或工程图纸中移位）
                        gestureLabel.innerText = "MARK VIII: HOLO-PANNING (双手空间平移模式)";
                        particleSystem.material.color.setHex(0x00ffcc);
                        // 摄像机平滑映射双手中心点坐标
                        camera.position.x += ((0.5 - midpointX) * 200 - camera.position.x) * 0.15;
                        camera.position.y += ((0.5 - midpointY) * -180 - camera.position.y) * 0.15;
                    } else {
                        // 🌟 交互状态 B：双手拉伸/聚拢 -> “视角解析放大/缩小”
                        gestureLabel.innerText = "MARK VIII: DUAL-HAND ZOOM (双手空间解析模式)";
                        particleSystem.material.color.setHex(0xffaa00);
                        // 将距离映射为摄像机的 Z 轴视角平滑移动 (推进或后退)
                        const targetZ = originalCameraPosition.z - (dist2D * 300 - 50);
                        camera.position.z += (Math.max(50, targetZ) - camera.position.z) * 0.1;
                    }
                } else if (results.multiHandLandmarks && results.multiHandLandmarks.length === 1) {
                    // 🌟 2. 单手模式：捏合截图抓取
                    const lm = results.multiHandLandmarks[0];
                    const pinchDist = Math.sqrt(Math.pow(lm[4].x - lm[8].x, 2) + Math.pow(lm[4].y - lm[8].y, 2));
                    
                    if (pinchDist < 0.05) {
                        gestureLabel.innerText = "SPATIAL SENSOR: PINCH TO CAPTURE (执行空气抓取)";
                        particleSystem.material.color.setHex(0x00ffcc);
                        camera.position.z += (100 - camera.position.z) * 0.1; // 单手抓取时视角强行拉进
                        if(!isTaskLock) {
                            isTaskLock = true;
                            setTimeout(() => {
                                const link = document.createElement('a'); link.download = `jarvis_scan.png`; link.href = renderer.domElement.toDataURL(); link.click();
                            }, 400);
                        }
                    } else {
                        gestureLabel.innerText = "SPATIAL SENSOR: TRACKING (单手阵列锁定)";
                        isTaskLock = false;
                        camera.position.copy(originalCameraPosition); // 单手常态，视角归位
                    }
                } else {
                    gestureLabel.innerText = "SPATIAL SENSOR: SCANNING... (等待手势接入)";
                    particleSystem.material.color.setHex(0x00d2ff);
                    camera.position.lerp(originalCameraPosition, 0.1); // 手移开屏幕，视角平滑归位中心
                }
            });
            const cameraHelper = new Camera(videoElement, { onFrame: async () => { await hands.send({ image: videoElement }); }, width: 640, height: 480 });
            cameraHelper.start();

            initInterruptibleBrainAndVoice();
        }

        // --- 实时联网嗅探大模型大脑 ---
        async function performLiveWebSearch(query) {
            try {
                const response = await fetch('https://api.tavily.com/search', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_key: TAVILY_API_KEY, query: query, search_depth: "basic", include_answer: true, max_results: 3 })
                });
                const data = await response.json();
                let context = `【系统全网实时抓取数据】\n直接答案：${data.answer || '无直接答案'}\n来源摘要：\n`;
                data.results.forEach(res => { context += `- ${res.title}: ${res.content}\n`; });
                return context;
            } catch (error) { return null; }
        }

        // --- 全双工无死锁打断中枢 ---
        function initInterruptibleBrainAndVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = true;  // 🌟 核心：全双工全天候监听，实现即时插嘴打断
            recognition.interimResults = false;

            recognition.onresult = async (event) => {
                const text = event.results[event.results.length - 1][0].transcript;
                if (!text.trim()) return;

                // 🌟 小爱同学级核心打断：你一说话，立马强行停止网页语音合成引擎！
                if(window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel(); 
                    console.log("已打断施法，重新侦听。");
                }

                document.getElementById('subtitle-box').innerText = "Sir: " + text;
                let finalPrompt = text;

                if (text.includes("查") || text.includes("最新") || text.includes("今天") || text.includes("谁是") || text.includes("新闻")) {
                    animationStatus = "SEARCHING";
                    document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: BROWSING (嗅探全网节点...)";
                    const webContext = await performLiveWebSearch(text);
                    if (webContext) finalPrompt = `${webContext}\n\n先生的问题是：${text}\n请根据上述情报回复。不要提你是根据文本回答，直接汇报结论。`;
                }

                animationStatus = "THINKING";
                document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: THINKING (量子算力运算中...)";

                messages.push({"role": "user", "content": finalPrompt});
                try {
                    const response = await fetch('https://api.siliconflow.cn/v1/chat/completions', {
                        method: 'POST', headers: { 'Authorization': `Bearer ${DEEPSEEK_API_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model: MODEL_ID, messages: messages, temperature: 0.4 })
                    });
                    const data = await response.json();
                    const jarvisReply = data.choices[0].message.content;
                    messages.pop(); 
                    messages.push({"role": "user", "content": text});
                    messages.push({"role": "assistant", "content": jarvisReply});
                    
                    jarvisSpeak(jarvisReply);
                } catch(e) { jarvisSpeak("链路中断，先生。您的余额是否充足？"); }
            };

            recognition.onend = () => { setTimeout(() => { recognition.start(); }, 100); };
            recognition.start();
            document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: LISTENING (随时聆听口令...)";
            animationStatus = "LISTENING";
            
            // 延迟开场请安，确保声音通道已彻底暴力解锁并拉起
            setTimeout(() => {
                jarvisSpeak("全屏双手全息空间协议已合闸，全双工语音协议已上线。请吩咐，先生。");
            }, 1000);
        }

        // --- 强制匹配高清中文原声库 ---
        function jarvisSpeak(text) {
            document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: SPEAKING";
            document.getElementById('subtitle-box').innerText = "JARVIS: " + text;
            animationStatus = "SPEAKING";

            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN'; 
            
            // 🌟 强行强制匹配系统中最好听的中文原声 (Edge/Chrome 兼容)
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.lang.includes('zh') && (v.name.includes('Google') || v.name.includes('Xiaoxiao') || v.name.includes('Yunxi')));
            if(preferredVoice) utterance.voice = preferredVoice;
            
            utterance.rate = 1.05; // 略微果断的速度
            utterance.pitch = 0.92; // 略微稳重的电磁质感
            
            utterance.onend = () => {
                document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: LISTENING (待命...)";
                animationStatus = "IDLE";
                // 播报完毕，重置球体材质颜色和视角，为主权交还麦克风做准备
                particleSystem.material.color.setHex(0x00d2ff);
            };
            
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
