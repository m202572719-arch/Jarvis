<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>JARVIS MARK XI - HOLOGRAPHIC OS</title>
    <style>
        body { background-color: #000205; margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #00d2ff; user-select: none; cursor: none; }
        #canvas-zone { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; opacity: 0.6; }
        
        /* 传感器监控 */
        #webcam { position: absolute; top: 40px; right: 40px; width: 180px; height: 135px; z-index: 20; border: 1px solid rgba(0, 210, 255, 0.5); transform: scaleX(-1); filter: grayscale(100%) contrast(150%) sepia(30%) hue-rotate(150deg); border-radius: 8px; }
        
        /* 全息准星 (物理碰撞核心) */
        #holo-cursor { position: absolute; top: 50%; left: 50%; width: 35px; height: 35px; border: 2px solid #00d2ff; border-radius: 50%; z-index: 9999; pointer-events: none; transform: translate(-50%, -50%); transition: border-color 0.1s, width 0.1s, height 0.1s, background-color 0.1s; box-shadow: 0 0 15px rgba(0,210,255,0.5); }
        #holo-cursor::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #00d2ff; border-radius: 50%; transform: translate(-50%, -50%); }
        
        /* --- 斯塔克全息视窗 UI --- */
        .holo-window { position: absolute; background: rgba(0, 20, 40, 0.6); border: 1px solid rgba(0, 210, 255, 0.4); box-shadow: 0 0 20px rgba(0,210,255,0.2); backdrop-filter: blur(8px); border-radius: 10px; z-index: 50; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); overflow: hidden; }
        .holo-window::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 30px; background: rgba(0, 210, 255, 0.15); border-bottom: 1px solid rgba(0, 210, 255, 0.3); }
        .holo-title { position: absolute; top: 5px; left: 15px; font-size: 12px; font-weight: bold; letter-spacing: 2px; color: #fff; }
        /* 交互遮罩层（用于接收准星射线） */
        .interaction-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
        .interaction-layer:hover { background: rgba(0, 210, 255, 0.1); }
        
        /* 视窗 1：全球雷达地图 */
        #win-map { top: 10%; left: 5%; width: 350px; height: 250px; }
        #win-map iframe { width: 100%; height: 100%; border: none; filter: invert(100%) hue-rotate(180deg) brightness(80%) contrast(120%); pointer-events: none; }
        
        /* 视窗 2：通讯与情报中枢 */
        #win-chat { top: 50%; left: 5%; width: 350px; height: 350px; }
        #chat-content { margin-top: 35px; padding: 15px; font-family: 'Courier New', monospace; font-size: 13px; color: #00ffcc; line-height: 1.6; height: calc(100% - 65px); overflow-y: auto; }
        
        /* 视窗 3：核心能量雷达 */
        #win-radar { top: 10%; right: 5%; width: 280px; height: 280px; display: flex; align-items: center; justify-content: center; }
        .radar-circle { width: 200px; height: 200px; border: 1px dashed #00d2ff; border-radius: 50%; position: relative; animation: spin 4s linear infinite; }
        .radar-circle::after { content: ''; position: absolute; top: 0; left: 50%; width: 2px; height: 100px; background: linear-gradient(to bottom, #00d2ff, transparent); transform-origin: bottom; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 焦点放大状态 (被隔空点击后) */
        .holo-window.expanded { top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) scale(1.8) !important; z-index: 1000 !important; box-shadow: 0 0 50px rgba(0,210,255,0.6) !important; border: 2px solid #00d2ff !important; }

        /* 系统状态文本 */
        #sys-status { position: absolute; bottom: 40px; left: 40px; font-size: 20px; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 10px #00d2ff; z-index: 100; }
        #subtitle-box { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 60%; text-align: center; font-size: 24px; color: #ffffff; text-shadow: 0 0 15px #00d2ff; font-weight: 600; z-index: 100; }

        #start-shield { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #01040a; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; }
        .btn { padding: 20px 40px; border: 2px solid #00d2ff; background: rgba(0, 210, 255, 0.1); color: #00d2ff; font-size: 22px; font-weight: bold; letter-spacing: 2px; box-shadow: 0 0 30px rgba(0, 210, 255, 0.4); border-radius: 8px; transition: 0.3s; }
        .btn:hover { background: rgba(0, 210, 255, 0.4); box-shadow: 0 0 50px #00d2ff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="start-shield" onclick="bootMarkXI()">
        <div class="btn">授权启动 MARK XI 全息视窗系统</div>
    </div>

    <div id="canvas-zone"></div>
    <video id="webcam" autoplay playsinline></video>
    <div id="holo-cursor"></div>

    <div class="holo-window" id="win-map">
        <div class="interaction-layer" data-target="win-map"></div>
        <div class="holo-title">SATELLITE LINK // GLOBAL MAP</div>
        <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=113.8,22.5,114.2,22.8&layer=mapnik"></iframe>
    </div>

    <div class="holo-window" id="win-chat">
        <div class="interaction-layer" data-target="win-chat"></div>
        <div class="holo-title">COMMS // INTELLIGENCE LOG</div>
        <div id="chat-content">
            [SYSTEM] MARK XI 初始化完成。<br>
            [SYSTEM] 等待先生口述指令...<br>
        </div>
    </div>

    <div class="holo-window" id="win-radar">
        <div class="interaction-layer" data-target="win-radar"></div>
        <div class="holo-title">DIAGNOSTICS // CORE RADAR</div>
        <div class="radar-circle"></div>
    </div>

    <div id="sys-status">SYSTEM: STANDBY</div>
    <div id="subtitle-box"></div>

    <script>
        // 🚨 填入您的密钥！
        const DEEPSEEK_API_KEY = "sk-joikwvbzzgcfhbdyiwnrkiwkvxgisedoirvstkqsysdzsfiw";
        const TAVILY_API_KEY = "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"; 
        
        const MODEL_ID = "deepseek-ai/DeepSeek-V3";
        let messages = [{"role": "system", "content": "你是贾维斯(JARVIS)。称呼用户为“先生(Sir)”。用极简的口语回答，不要超过两句话，严禁Markdown。"}];

        let cursorElement;
        let isPinching = false;
        let activeWindow = null; // 当前被放大激活的视窗

        // --- 1. 背景 3D 矩阵氛围 ---
        function init3DEngine() {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 1000);
            camera.position.z = 300;
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-zone').appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(3000 * 3);
            for (let i=0; i<3000; i++) {
                positions[i*3] = (Math.random() - 0.5) * 800;
                positions[i*3+1] = (Math.random() - 0.5) * 800;
                positions[i*3+2] = (Math.random() - 0.5) * 800;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: 0x004488, size: 2, transparent: true, opacity: 0.5 });
            const particles = new THREE.Points(geometry, material);
            scene.add(particles);

            function animate() {
                requestAnimationFrame(animate);
                particles.rotation.y += 0.001;
                particles.rotation.x += 0.0005;
                renderer.render(scene, camera);
            }
            animate();
        }

        // --- 2. 空间准星与视窗真实物理碰撞 (核心魔法) ---
        async function bootMarkXI() {
            document.getElementById('start-shield').style.display = 'none';
            init3DEngine();
            cursorElement = document.getElementById('holo-cursor');
            
            // 强行加载并预热语音列表，治愈哑巴问题
            speechSynthesis.getVoices();
            let unlockUtterance = new SpeechSynthesisUtterance("系统已上线");
            unlockUtterance.volume = 0.01;
            speechSynthesis.speak(unlockUtterance);

            const videoElement = document.getElementById('webcam');
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length === 1) {
                    const lm = results.multiHandLandmarks[0];
                    
                    // 🌟 1. 映射屏幕坐标
                    const x = (1 - lm[8].x) * window.innerWidth;
                    const y = lm[8].y * window.innerHeight;
                    cursorElement.style.left = `${x}px`;
                    cursorElement.style.top = `${y}px`;
                    cursorElement.style.display = 'block';

                    // 🌟 2. 物理射线检测 (看看光标下面压着哪个视窗)
                    // 暂时隐藏光标自身，以免挡住射线
                    cursorElement.style.display = 'none'; 
                    const elementUnderCursor = document.elementFromPoint(x, y);
                    cursorElement.style.display = 'block';

                    // 🌟 3. 捏合判定 (隔空点击)
                    const pinchDist = Math.sqrt(Math.pow(lm[4].x - lm[8].x, 2) + Math.pow(lm[4].y - lm[8].y, 2));
                    
                    if (pinchDist < 0.04) {
                        if (!isPinching) {
                            isPinching = true;
                            // 捏合视觉反馈
                            cursorElement.style.borderColor = '#ff0055';
                            cursorElement.style.backgroundColor = 'rgba(255,0,85,0.5)';
                            cursorElement.style.width = '20px'; cursorElement.style.height = '20px';
                            
                            // 🚀 触发真实点击事件！
                            if (elementUnderCursor && elementUnderCursor.classList.contains('interaction-layer')) {
                                const targetId = elementUnderCursor.getAttribute('data-target');
                                const targetWindow = document.getElementById(targetId);
                                
                                // 逻辑：如果已经放大，则缩小；如果没放大，则放大此窗口
                                if (activeWindow === targetWindow) {
                                    targetWindow.classList.remove('expanded');
                                    activeWindow = null;
                                    jarvisSpeak("已收起面板。");
                                } else {
                                    if (activeWindow) activeWindow.classList.remove('expanded'); // 收起其他
                                    targetWindow.classList.add('expanded');
                                    activeWindow = targetWindow;
                                    jarvisSpeak("正在为您展开详情。");
                                }
                            }
                        }
                    } else {
                        isPinching = false;
                        cursorElement.style.borderColor = '#00d2ff';
                        cursorElement.style.backgroundColor = 'transparent';
                        cursorElement.style.width = '35px'; cursorElement.style.height = '35px';
                        
                        // 悬停发光反馈
                        if (elementUnderCursor && elementUnderCursor.classList.contains('interaction-layer')) {
                            cursorElement.style.borderColor = '#00ffcc';
                        }
                    }
                } else {
                    cursorElement.style.display = 'none';
                }
            });
            
            const cameraHelper = new Camera(videoElement, { onFrame: async () => { await hands.send({ image: videoElement }); }, width: 640, height: 480 });
            cameraHelper.start();

            initVoiceAgent();
        }

        // --- 3. 智能听写与情报大模型 ---
        function initVoiceAgent() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = true;  
            recognition.interimResults = true; 

            const chatBox = document.getElementById('chat-content');

            recognition.onresult = async (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                }

                if (finalTranscript.trim().length > 0) {
                    if(speechSynthesis.speaking) speechSynthesis.cancel(); // 随时打断
                    
                    document.getElementById('subtitle-box').innerText = "Sir: " + finalTranscript;
                    chatBox.innerHTML += `<br><span style="color:#fff;">[Sir] ${finalTranscript}</span>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    document.getElementById('sys-status').innerText = "SYSTEM: THINKING...";

                    let finalPrompt = finalTranscript;
                    if (finalTranscript.includes("查") || finalTranscript.includes("最新") || finalTranscript.includes("天气")) {
                        chatBox.innerHTML += `<br><span style="color:#ffaa00;">[JARVIS] 正在接入全球卫星情报网...</span>`;
                        try {
                            const res = await fetch('https://api.tavily.com/search', {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ api_key: TAVILY_API_KEY, query: finalTranscript, search_depth: "basic", include_answer: true, max_results: 2 })
                            });
                            const data = await res.json();
                            finalPrompt = `情报：${data.answer}\n先生问题：${finalTranscript}\n基于情报极简回复。`;
                        } catch(e) {}
                    }

                    messages.push({"role": "user", "content": finalPrompt});
                    try {
                        const response = await fetch('https://api.siliconflow.cn/v1/chat/completions', {
                            method: 'POST', headers: { 'Authorization': `Bearer ${DEEPSEEK_API_KEY}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ model: MODEL_ID, messages: messages, temperature: 0.5 })
                        });
                        const data = await response.json();
                        const jarvisReply = data.choices[0].message.content;
                        
                        messages.pop(); 
                        messages.push({"role": "user", "content": finalTranscript});
                        messages.push({"role": "assistant", "content": jarvisReply});
                        
                        chatBox.innerHTML += `<br><span style="color:#00ffcc;">[JARVIS] ${jarvisReply}</span><br>`;
                        chatBox.scrollTop = chatBox.scrollHeight;
                        jarvisSpeak(jarvisReply);
                    } catch(e) { jarvisSpeak("网络链路阻断。"); }
                }
            };

            recognition.onend = () => { setTimeout(() => { recognition.start(); }, 100); };
            recognition.start();
            
            setTimeout(() => { jarvisSpeak("全息视窗协议已上线。先生，尝试隔空抓取屏幕上的面板。"); }, 1500);
        }

        // --- 4. 完美中英文声带 ---
        function jarvisSpeak(text) {
            document.getElementById('sys-status').innerText = "SYSTEM: SPEAKING";
            document.getElementById('subtitle-box').innerText = "JARVIS: " + text;

            speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN'; 
            
            // 确保加载语音
            const voices = speechSynthesis.getVoices();
            let voice = voices.find(v => v.lang.includes('zh') && (v.name.includes('Microsoft') || v.name.includes('Google') || v.name.includes('Yaoyao')));
            if(voice) utterance.voice = voice;
            
            utterance.rate = 1.05; 
            utterance.pitch = 0.95; 
            
            utterance.onend = () => { document.getElementById('sys-status').innerText = "SYSTEM: STANDBY"; };
            speechSynthesis.speak(utterance);
        }
        
        // 浏览器兼容性：确保声音列表加载完成
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => { speechSynthesis.getVoices(); };
        }
    </script>
</body>
</html>
