<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>JARVIS MARK VII - HOLOGRAPHIC OS</title>
    <style>
        body { background-color: #01040a; margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; color: #00d2ff; user-select: none; }
        #canvas-zone { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #webcam { position: absolute; top: 40px; right: 40px; width: 260px; height: 195px; z-index: 20; border: 2px solid rgba(0, 210, 255, 0.4); transform: scaleX(-1); border-radius: 12px; filter: grayscale(80%) contrast(120%) drop-shadow(0 0 20px rgba(0,210,255,0.3)); }
        .hud-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        #sys-status { position: absolute; top: 40px; left: 40px; font-size: 28px; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 15px #00d2ff; }
        #gesture-status { position: absolute; top: 85px; left: 40px; font-size: 18px; color: #ffaa00; text-shadow: 0 0 8px #ffaa00; font-weight: bold; }
        #interrupt-alert { position: absolute; top: 120px; left: 40px; font-size: 16px; color: #ff0055; font-weight: bold; display: none; text-shadow: 0 0 10px #ff0055; animation: blink 1s infinite; }
        #subtitle-box { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); width: 80%; text-align: center; font-size: 24px; color: #ffffff; text-shadow: 0 0 15px #00d2ff; font-weight: 600; line-height: 1.6; }
        #panel { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0, 210, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.3); padding: 15px 40px; border-radius: 10px; font-size: 15px; text-align: center; backdrop-filter: blur(5px); }
        #start-shield { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #01040a; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .btn { padding: 25px 50px; border: 2px solid #00d2ff; background: rgba(0, 210, 255, 0.1); color: #00d2ff; font-size: 22px; font-weight: bold; letter-spacing: 3px; box-shadow: 0 0 40px rgba(0, 210, 255, 0.4); border-radius: 6px; transition: 0.3s; }
        .btn:hover { background: rgba(0, 210, 255, 0.3); box-shadow: 0 0 60px #00d2ff; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="start-shield" onclick="bootMarkVII()">
        <div class="btn">载入 MARK VII 交互阵列</div>
    </div>

    <div id="canvas-zone"></div>
    <video id="webcam" autoplay playsinline></video>

    <div class="hud-overlay">
        <div id="sys-status">JARVIS MARK VII: OFFLINE</div>
        <div id="gesture-status">SPATIAL SENSOR: OFFLINE</div>
        <div id="interrupt-alert">⚠️ 已打断，正在重新接收指令...</div>
        <div id="subtitle-box"></div>
        <div id="panel">
            <b>【双手全息交互】</b> 伸出两只手：双手拉开 = 放大反应堆 | 双手靠近 = 缩小<br>
            <b>【随时打断系统】</b> 当他说话时，直接开口说新指令，他会瞬间闭嘴听您说
        </div>
    </div>

    <script>
        // 🚨 警告：请务必填入新的密钥！
        const DEEPSEEK_API_KEY = "sk-joikwvbzzgcfhbdyiwnrkiwkvxgisedoirvstkqsysdzsfiw";
        const TAVILY_API_KEY = "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"; 
        
        const MODEL_ID = "deepseek-ai/DeepSeek-V3";
        let messages = [{"role": "system", "content": "你是贾维斯(JARVIS)，极度聪明的AI助理。称呼用户为“先生(Sir)”。严格要求：回答极度精炼口语化，像人类对话，不要超过三句话，严禁出现Markdown和长篇大论。"}];

        // --- 全息 3D 渲染核心 ---
        let scene, camera, renderer, particleSystem;
        let animationStatus = "IDLE"; 
        let waveClock = 0;
        let targetScale = 1, currentScale = 1;
        let isTaskLock = false;

        function init3DEngine() {
            const zone = document.getElementById('canvas-zone');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 240;
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            zone.appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(4000 * 3); // 增加粒子浓度
            for (let i = 0; i < 4000; i++) {
                const theta = Math.random() * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * Math.random() - 1.0);
                const r = 90 + Math.random() * 5;
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: 0x00d2ff, size: 1.5, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            waveClock += 0.05;
            particleSystem.rotation.y += 0.003;
            
            // 阻尼缩放，手感更丝滑
            currentScale += (targetScale - currentScale) * 0.1;
            particleSystem.scale.set(currentScale, currentScale, currentScale);
            
            if (animationStatus === "SPEAKING") {
                particleSystem.material.color.setHex(0x00ffff);
                const pos = particleSystem.geometry.attributes.position.array;
                for (let i = 0; i < pos.length/3; i++) { pos[i * 3 + 1] += Math.sin(i * 0.1 + waveClock * 8) * 0.1; }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            } else if (animationStatus === "THINKING") {
                particleSystem.material.color.setHex(0xff0044);
                particleSystem.rotation.x += 0.05;
            } else if (animationStatus === "LISTENING") {
                particleSystem.material.color.setHex(0xffaa00);
            } else {
                particleSystem.material.color.setHex(0x00d2ff);
            }
            renderer.render(scene, camera);
        }

        // --- 核心启动：暴力解锁声音与双手交互 ---
        async function bootMarkVII() {
            document.getElementById('start-shield').style.display = 'none';
            init3DEngine();
            
            // 🌟 暴力防哑巴协议：点击瞬间强制载入空白音频，击穿 Chrome 安全锁！
            let unlockUtterance = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(unlockUtterance);

            const videoElement = document.getElementById('webcam');
            const gestureLabel = document.getElementById('gesture-status');
            
            // 🌟 升级为双手捕捉 (maxNumHands: 2)
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
                    // 🌟 双手操作模式：像电影里一样拉伸与压缩全息投影
                    gestureLabel.innerText = "SPATIAL: DUAL-HAND ZOOM (双指解析模式)";
                    particleSystem.material.color.setHex(0x00ffcc); // 切换为解析绿
                    
                    const hand1 = results.multiHandLandmarks[0][9]; // 左手中心
                    const hand2 = results.multiHandLandmarks[1][9]; // 右手中心
                    // 计算双手在 3D 空间的欧氏距离
                    const dist = Math.sqrt(Math.pow(hand1.x - hand2.x, 2) + Math.pow(hand1.y - hand2.y, 2));
                    
                    // 将距离映射为放大倍率 (距离越远，球体越大)
                    targetScale = 0.5 + (dist * 2.5); 
                    
                } else if (results.multiHandLandmarks && results.multiHandLandmarks.length === 1) {
                    // 🌟 单手操作模式：捏合截图
                    const lm = results.multiHandLandmarks[0];
                    const pinchDist = Math.sqrt(Math.pow(lm[4].x - lm[8].x, 2) + Math.pow(lm[4].y - lm[8].y, 2));
                    
                    if (pinchDist < 0.05) {
                        gestureLabel.innerText = "SPATIAL: PINCH TO CAPTURE (执行抓取)";
                        targetScale = 0.4;
                        particleSystem.material.color.setHex(0xffaa00);
                        if(!isTaskLock) {
                            isTaskLock = true;
                            setTimeout(() => {
                                const link = document.createElement('a'); link.download = `jarvis_scan.png`; link.href = renderer.domElement.toDataURL(); link.click();
                            }, 400);
                        }
                    } else {
                        gestureLabel.innerText = "SPATIAL: TRACKING (单手锁定)";
                        targetScale = 1.0;
                        isTaskLock = false;
                    }
                } else {
                    gestureLabel.innerText = "SPATIAL: SCANNING... (雷达扫描中)";
                    targetScale = 1.0;
                }
            });
            const cameraHelper = new Camera(videoElement, { onFrame: async () => { await hands.send({ image: videoElement }); }, width: 640, height: 480 });
            cameraHelper.start();

            initInterruptibleVoice();
        }

        // --- 全双工打断与听觉中枢 ---
        function initInterruptibleVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = true;  // 🌟 核心：无限监听，随时收集声波
            recognition.interimResults = false;

            recognition.onresult = async (event) => {
                const text = event.results[event.results.length - 1][0].transcript;
                if (!text.trim()) return;

                // 🌟 绝对打断协议：一旦检测到您说了新话，立刻掐死他正在播放的语音！
                window.speechSynthesis.cancel(); 
                
                if (animationStatus === "SPEAKING") {
                    // 触发打断视觉特效
                    const alertBox = document.getElementById('interrupt-alert');
                    alertBox.style.display = 'block';
                    setTimeout(() => { alertBox.style.display = 'none'; }, 2000);
                }

                document.getElementById('subtitle-box').innerText = "Sir: " + text;
                animationStatus = "THINKING";
                document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: THINKING...";

                // 联网判断
                let finalPrompt = text;
                if (text.includes("查") || text.includes("最新") || text.includes("今天")) {
                    document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: BROWSING...";
                    try {
                        const res = await fetch('https://api.tavily.com/search', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ api_key: TAVILY_API_KEY, query: text, search_depth: "basic", include_answer: true, max_results: 2 })
                        });
                        const data = await res.json();
                        finalPrompt = `【最新情报】${data.answer}\n先生的问题：${text}\n请基于情报精炼回答，不要提检索来源。`;
                    } catch(e) {}
                }

                messages.push({"role": "user", "content": finalPrompt});
                try {
                    const response = await fetch('https://api.siliconflow.cn/v1/chat/completions', {
                        method: 'POST', headers: { 'Authorization': `Bearer ${DEEPSEEK_API_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model: MODEL_ID, messages: messages, temperature: 0.4 })
                    });
                    const data = await response.json();
                    const jarvisReply = data.choices[0].message.content;
                    
                    messages.pop(); 
                    messages.push({"role": "user", "content": text});
                    messages.push({"role": "assistant", "content": jarvisReply});
                    
                    jarvisSpeak(jarvisReply);
                } catch(e) { jarvisSpeak("网络连接发生严重偏移，先生。"); }
            };

            recognition.onend = () => { setTimeout(() => { recognition.start(); }, 100); };
            recognition.start();
            
            // 延迟开场白，确保系统已完全暴力解锁声音
            setTimeout(() => {
                jarvisSpeak("全息双手阵列已校准。全双工语音协议已上线。随时可以打断我，先生。");
            }, 1000);
        }

        // --- 强制匹配中文原声库 ---
        function jarvisSpeak(text) {
            document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: SPEAKING";
            document.getElementById('subtitle-box').innerText = "JARVIS: " + text;
            animationStatus = "SPEAKING";

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN'; // 强行指定语言
            
            // 强行从系统中抓取最好听的中文男声 (Edge/Chrome 兼容)
            const voices = window.speechSynthesis.getVoices();
            let selectedVoice = voices.find(v => v.lang.includes('zh') && (v.name.includes('Yunxi') || v.name.includes('Google') || v.name.includes('Male')));
            if(!selectedVoice) selectedVoice = voices.find(v => v.lang.includes('zh')); // 兜底中文
            if(selectedVoice) utterance.voice = selectedVoice;
            
            utterance.rate = 1.05; 
            utterance.pitch = 0.9;
            
            utterance.onend = () => {
                document.getElementById('sys-status').innerText = "JARVIS PROTOCOL: LISTENING";
                animationStatus = "LISTENING";
            };
            
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
