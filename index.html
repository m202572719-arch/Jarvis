<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>JARVIS MARK XII - LIVE TELEMETRY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body { background-color: #00040a; margin: 0; overflow: hidden; font-family: 'Share Tech Mono', monospace; color: #00f3ff; user-select: none; cursor: none; }
        
        /* 扫描线与全息网格背景 */
        #canvas-zone { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; opacity: 0.7; }
        .scanlines { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 243, 255, 0.05) 50%, rgba(0, 243, 255, 0.05)); background-size: 100% 4px; z-index: 2; pointer-events: none; }
        
        #webcam { position: absolute; top: 40px; right: 40px; width: 180px; height: 135px; z-index: 20; border: 1px solid rgba(0, 243, 255, 0.3); transform: scaleX(-1); filter: grayscale(100%) contrast(150%) brightness(1.2) sepia(100%) hue-rotate(180deg); box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); }
        
        /* 现代化物理准星 */
        #holo-cursor { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; border: 1px solid #00f3ff; border-radius: 50%; z-index: 9999; pointer-events: none; transform: translate(-50%, -50%); transition: all 0.1s ease-out; box-shadow: inset 0 0 10px rgba(0,243,255,0.5), 0 0 15px rgba(0,243,255,0.5); display: flex; align-items: center; justify-content: center; }
        #holo-cursor::before { content: ''; position: absolute; width: 60%; height: 1px; background: #00f3ff; }
        #holo-cursor::after { content: ''; position: absolute; width: 1px; height: 60%; background: #00f3ff; }

        /* --- 现代化全息面板 UI (Glassmorphism) --- */
        .holo-window { position: absolute; background: rgba(0, 15, 30, 0.4); border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 0 30px rgba(0,243,255,0.1), inset 0 0 20px rgba(0,243,255,0.05); backdrop-filter: blur(12px); border-radius: 4px; z-index: 50; transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); overflow: hidden; display: flex; flex-direction: column; clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px)); }
        
        .holo-title { padding: 8px 15px; font-size: 12px; font-weight: bold; letter-spacing: 2px; color: #000; background: rgba(0, 243, 255, 0.8); border-bottom: 1px solid #00f3ff; display: flex; justify-content: space-between; }
        .holo-title span.blink { animation: blink 1s infinite; color: #ff0055; font-weight: bold; }
        
        .interaction-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
        .interaction-layer:hover { background: rgba(0, 243, 255, 0.05); }

        /* 视窗 1：环境态势感知 (真实数据) */
        #win-env { top: 10%; left: 5%; width: 380px; height: 220px; }
        .env-data { padding: 15px; font-size: 14px; line-height: 1.8; color: #00f3ff; text-shadow: 0 0 5px rgba(0,243,255,0.5); z-index: 5; pointer-events: none; }
        .highlight { color: #fff; font-weight: bold; }

        /* 视窗 2：语音交互阵列 */
        #win-chat { top: 45%; left: 5%; width: 380px; height: 400px; }
        #chat-content { padding: 15px; font-size: 13px; color: #00ffcc; line-height: 1.6; flex-grow: 1; overflow-y: auto; text-shadow: 0 0 4px rgba(0,255,204,0.4); pointer-events: none; z-index: 5; }

        /* 视窗 3：全球量子数据流 (真实 WebSocket 高频交易数据) */
        #win-stream { top: 10%; right: 5%; width: 360px; height: 450px; }
        #data-stream { padding: 10px; font-size: 11px; color: #ff0055; line-height: 1.4; height: 100%; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; text-shadow: 0 0 5px rgba(255,0,85,0.5); pointer-events: none; z-index: 5; }

        /* 悬浮放大状态 */
        .holo-window.expanded { top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) scale(1.6) !important; z-index: 1000 !important; box-shadow: 0 0 60px rgba(0,243,255,0.4), inset 0 0 30px rgba(0,243,255,0.2) !important; border: 1px solid #00f3ff !important; }

        /* 底部 HUD */
        #sys-status { position: absolute; bottom: 40px; left: 40px; font-size: 22px; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 10px #00f3ff; z-index: 100; text-transform: uppercase; }
        #subtitle-box { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 60%; text-align: center; font-size: 26px; color: #ffffff; text-shadow: 0 0 20px #00f3ff; font-weight: bold; z-index: 100; }

        #start-shield { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #000205; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; }
        .btn { padding: 20px 50px; border: 1px solid #00f3ff; background: rgba(0, 243, 255, 0.05); color: #00f3ff; font-size: 24px; letter-spacing: 4px; font-family: 'Share Tech Mono', monospace; text-transform: uppercase; transition: 0.3s; position: relative; overflow: hidden; }
        .btn:hover { background: rgba(0, 243, 255, 0.2); box-shadow: 0 0 40px #00f3ff; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        
        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #00f3ff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="start-shield" onclick="bootMarkXII()">
        <div class="btn">INITIALIZE SYSTEM</div>
    </div>

    <div class="scanlines"></div>
    <div id="canvas-zone"></div>
    <video id="webcam" autoplay playsinline></video>
    <div id="holo-cursor"></div>

    <!-- 视窗 1：真实环境感知 -->
    <div class="holo-window" id="win-env">
        <div class="interaction-layer" data-target="win-env"></div>
        <div class="holo-title"><span>SYS.TELEMETRY</span><span class="blink">REC</span></div>
        <div class="env-data">
            LOCAL TIME: <span id="clock" class="highlight">SYNCING...</span><br>
            NETWORK IP: <span id="ip-addr">SCANNING...</span><br>
            LOCATION: <span id="geo-loc">TRIANGULATING...</span><br>
            <br>
            <span style="color:#00ffcc">UMBILICAL STRESS:</span> NOMINAL<br>
            <span style="color:#00ffcc">RISER TERMINATION:</span> SECURED
        </div>
    </div>

    <!-- 视窗 2：语音与 AI 中枢 -->
    <div class="holo-window" id="win-chat">
        <div class="interaction-layer" data-target="win-chat"></div>
        <div class="holo-title"><span>AI.COMMS_LOG</span><span>ACTIVE</span></div>
        <div id="chat-content">
            [SYS] MARK XII KERNEL LOADED.<br>
            [SYS] AWAITING VOICE DIRECTIVE...<br>
        </div>
    </div>

    <!-- 视窗 3：真实 WebSocket 瀑布流 -->
    <div class="holo-window" id="win-stream">
        <div class="interaction-layer" data-target="win-stream"></div>
        <div class="holo-title"><span>QUANTUM.DATA_STREAM</span><span class="blink">LIVE</span></div>
        <div id="data-stream"></div>
    </div>

    <div id="sys-status">STANDBY</div>
    <div id="subtitle-box"></div>

    <script>
        // 🚨 请填入您的真实密钥！
        const DEEPSEEK_API_KEY = "sk-joikwvbzzgcfhbdyiwnrkiwkvxgisedoirvstkqsysdzsfiw";
        const TAVILY_API_KEY = "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"; 
        
        const MODEL_ID = "deepseek-ai/DeepSeek-V3";
        let messages = [{"role": "system", "content": "你是极具未来感的AI助理JARVIS。称呼用户为先生(Sir)。回答极致简短、高冷，严禁Markdown格式。直接给出答案。"}];

        let cursorElement;
        let isPinching = false;
        let activeWindow = null;

        // --- 1. 启动 WebSocket 真实高频数据流 (全球加密货币交易毫秒级快照) ---
        function initLiveStream() {
            const streamBox = document.getElementById('data-stream');
            // 接入币安真实的 WebSocket，感受疯狂刷新的数据瀑布
            const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const time = new Date(data.E).toISOString().split('T')[1].slice(0,-1);
                const price = parseFloat(data.p).toFixed(2);
                const qty = parseFloat(data.q).toFixed(4);
                const color = data.m ? "#ff0055" : "#00ffcc";
                
                const log = document.createElement('div');
                log.innerHTML = `<span style="color:#555">[${time}]</span> HASH: ${data.t} | VOL: <span style="color:${color}">${qty}</span> @ ${price}`;
                streamBox.appendChild(log);
                
                if (streamBox.children.length > 25) streamBox.removeChild(streamBox.firstChild);
            };
        }

        // --- 2. 真实环境感知 (时间与 IP 接口) ---
        function initTelemetry() {
            // 实时时钟
            setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric", fractionalSecondDigits: 2 }); }, 50);
            
            // 真实获取网络位置
            fetch('https://ipapi.co/json/')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('ip-addr').innerText = data.ip || "UNKNOWN";
                    document.getElementById('geo-loc').innerText = `${data.city || "UNKNOWN"}, ${data.country || "EARTH"}`;
                }).catch(() => {
                    document.getElementById('ip-addr').innerText = "ENCRYPTED";
                    document.getElementById('geo-loc').innerText = "PROXY SECURED";
                });
        }

        // --- 3. 3D 网格背景矩阵 ---
        function init3DEngine() {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 1000);
            camera.position.z = 400;
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-zone').appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(5000 * 3);
            for (let i=0; i<5000; i++) {
                positions[i*3] = (Math.random() - 0.5) * 1000;
                positions[i*3+1] = (Math.random() - 0.5) * 1000;
                positions[i*3+2] = (Math.random() - 0.5) * 1000;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: 0x00f3ff, size: 1.5, transparent: true, opacity: 0.4 });
            const particles = new THREE.Points(geometry, material);
            scene.add(particles);

            function animate() {
                requestAnimationFrame(animate);
                particles.rotation.y += 0.0008;
                particles.rotation.z += 0.0003;
                renderer.render(scene, camera);
            }
            animate();
        }

        // --- 4. 空间准星与视窗物理碰撞 ---
        async function bootMarkXII() {
            document.getElementById('start-shield').style.display = 'none';
            init3DEngine();
            initLiveStream();
            initTelemetry();
            
            cursorElement = document.getElementById('holo-cursor');
            
            // 强行加载语音
            speechSynthesis.getVoices();
            let unlockUtterance = new SpeechSynthesisUtterance("");
            speechSynthesis.speak(unlockUtterance);

            const videoElement = document.getElementById('webcam');
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length === 1) {
                    const lm = results.multiHandLandmarks[0];
                    const x = (1 - lm[8].x) * window.innerWidth;
                    const y = lm[8].y * window.innerHeight;
                    cursorElement.style.left = `${x}px`;
                    cursorElement.style.top = `${y}px`;
                    cursorElement.style.display = 'flex';

                    cursorElement.style.display = 'none'; 
                    const elementUnderCursor = document.elementFromPoint(x, y);
                    cursorElement.style.display = 'flex';

                    const pinchDist = Math.sqrt(Math.pow(lm[4].x - lm[8].x, 2) + Math.pow(lm[4].y - lm[8].y, 2));
                    
                    if (pinchDist < 0.04) {
                        if (!isPinching) {
                            isPinching = true;
                            cursorElement.style.borderColor = '#ff0055';
                            cursorElement.style.boxShadow = 'inset 0 0 20px rgba(255,0,85,0.8)';
                            cursorElement.style.transform = 'translate(-50%, -50%) scale(0.6)';
                            
                            if (elementUnderCursor && elementUnderCursor.classList.contains('interaction-layer')) {
                                const targetId = elementUnderCursor.getAttribute('data-target');
                                const targetWindow = document.getElementById(targetId);
                                
                                if (activeWindow === targetWindow) {
                                    targetWindow.classList.remove('expanded');
                                    activeWindow = null;
                                    jarvisSpeak("面板已收回。");
                                } else {
                                    if (activeWindow) activeWindow.classList.remove('expanded');
                                    targetWindow.classList.add('expanded');
                                    activeWindow = targetWindow;
                                    jarvisSpeak("全息视窗已锁定放大。");
                                }
                            }
                        }
                    } else {
                        isPinching = false;
                        cursorElement.style.borderColor = '#00f3ff';
                        cursorElement.style.boxShadow = 'inset 0 0 10px rgba(0,243,255,0.5), 0 0 15px rgba(0,243,255,0.5)';
                        cursorElement.style.transform = 'translate(-50%, -50%) scale(1)';
                        
                        if (elementUnderCursor && elementUnderCursor.classList.contains('interaction-layer')) {
                            cursorElement.style.transform = 'translate(-50%, -50%) scale(1.3)';
                        }
                    }
                } else {
                    cursorElement.style.display = 'none';
                }
            });
            
            const cameraHelper = new Camera(videoElement, { onFrame: async () => { await hands.send({ image: videoElement }); }, width: 640, height: 480 });
            cameraHelper.start();

            initVoiceAgent();
        }

        // --- 5. AI 中枢引擎 ---
        function initVoiceAgent() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = true;  
            recognition.interimResults = true; 

            const chatBox = document.getElementById('chat-content');

            recognition.onresult = async (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                }

                if (finalTranscript.trim().length > 0) {
                    if(speechSynthesis.speaking) speechSynthesis.cancel();
                    
                    document.getElementById('subtitle-box').innerText = "Sir: " + finalTranscript;
                    chatBox.innerHTML += `<br><span style="color:#fff;">> ${finalTranscript}</span>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    document.getElementById('sys-status').innerText = "STATUS: PROCESSING";

                    let finalPrompt = finalTranscript;
                    if (finalTranscript.includes("查") || finalTranscript.includes("最新") || finalTranscript.includes("什么")) {
                        chatBox.innerHTML += `<br><span style="color:#ffaa00;">[SYS] INITIATING TAVILY WEB SCAN...</span>`;
                        try {
                            const res = await fetch('https://api.tavily.com/search', {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ api_key: TAVILY_API_KEY, query: finalTranscript, search_depth: "basic", include_answer: true, max_results: 2 })
                            });
                            const data = await res.json();
                            finalPrompt = `外网情报：${data.answer}\n先生问题：${finalTranscript}\n结合情报，极简回复，勿提来源。`;
                        } catch(e) {}
                    }

                    messages.push({"role": "user", "content": finalPrompt});
                    try {
                        const response = await fetch('https://api.siliconflow.cn/v1/chat/completions', {
                            method: 'POST', headers: { 'Authorization': `Bearer ${DEEPSEEK_API_KEY}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ model: MODEL_ID, messages: messages, temperature: 0.4 })
                        });
                        const data = await response.json();
                        const jarvisReply = data.choices[0].message.content;
                        
                        messages.pop(); 
                        messages.push({"role": "user", "content": finalTranscript});
                        messages.push({"role": "assistant", "content": jarvisReply});
                        
                        chatBox.innerHTML += `<br><span style="color:#00f3ff;">[JARVIS] ${jarvisReply}</span><br>`;
                        chatBox.scrollTop = chatBox.scrollHeight;
                        jarvisSpeak(jarvisReply);
                    } catch(e) { jarvisSpeak("链路中断。"); }
                }
            };

            recognition.onend = () => { setTimeout(() => { recognition.start(); }, 100); };
            recognition.start();
            
            setTimeout(() => { jarvisSpeak("数据链路接通。全息态势感知阵列已上线。"); }, 1500);
        }

        // --- 6. 强效语音输出 ---
        function jarvisSpeak(text) {
            document.getElementById('sys-status').innerText = "STATUS: TRANSMITTING";
            document.getElementById('subtitle-box').innerText = "JARVIS: " + text;

            speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN'; 
            
            const voices = speechSynthesis.getVoices();
            let voice = voices.find(v => v.lang.includes('zh') && (v.name.includes('Microsoft') || v.name.includes('Google') || v.name.includes('Yaoyao')));
            if(voice) utterance.voice = voice;
            
            utterance.rate = 1.1; 
            utterance.pitch = 0.9; 
            
            utterance.onend = () => { document.getElementById('sys-status').innerText = "STATUS: STANDBY"; };
            speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
